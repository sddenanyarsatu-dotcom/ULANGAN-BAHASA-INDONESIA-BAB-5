
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Ulangan Bahasa Indonesia Kelas VI</title>
<style>
body{font-family:Arial,sans-serif;background:#edf4ff;margin:0;color:#183153}
header{background:#183153;color:white;text-align:center;padding:24px}
main{max-width:850px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 3px 12px #ccd5e3}
input,select,textarea{width:100%;padding:11px;margin:7px 0;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}
button{background:#2864dc;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
.question{padding:15px;border-bottom:1px solid #ddd}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🌍 Anak-Anak yang Mengubah Dunia</h1>
<p>Game Ulangan Bahasa Indonesia Kelas VI — Bab 5</p>
</header>
<main>
<section class="card" id="login">
<h2>Login Peserta Didik</h2>
<label>Nama siswa</label>
<select id="nama">
<option value="">Pilih nama siswa</option>
<option data-n="2759">ABID ALVARO GAVRIEL</option>
<option data-n="2760">AFFIN CHARLISA ACHYARNIS</option>
<option data-n="2761">ALBY FAREL AXEL FAIRUS</option>
<option data-n="2762">ANGGRAITA DARA KUSUMANINGRUM</option>
<option data-n="2763">ARGA ADAM ALFATIR</option>
<option data-n="2764">ARIF AZHARI SETIAWAN</option>
<option data-n="2765">AZIZ SATRIO PRAMBUDI</option>
<option data-n="2766">AZKA KHOIRUNNISA</option>
<option data-n="2820">BILQIS ZAHIRA ALYA AZIZA</option>
<option data-n="2767">DANIEL IRKHAM YUNIANTO</option>
<option data-n="2768">DELTA DANIES WICAKSONO</option>
<option data-n="2769">ELVINA NOVITA SARI</option>
<option data-n="2770">FATIN DESTIANA SHIDQIA</option>
<option data-n="2771">IAN THU ALFIAN</option>
<option data-n="2772">KHALISA ZAHRA RAMADHANI</option>
<option data-n="2774">LABIBAH ANINDYA JIHAN TALITA ULFA</option>
<option data-n="2775">MAYDA NURUL AZKIA</option>
<option data-n="2776">MUHAMMAD AMIRRUDIN</option>
<option data-n="2777">MUHAMMAD EZA HAFIZ ADITIYA</option>
<option data-n="2778">MUHAMMAD RIFKY CAHYO SAPUTRO</option>
<option data-n="2779">NURIYA JANNATUN NAIM</option>
<option data-n="2780">PRABU AHMAD AHNAFI</option>
<option data-n="2848">QEYLA ABSHARI FIRDA RAHMADANI</option>
<option data-n="2781">RAHMAT MAULANA</option>
<option data-n="2782">RAVA'EL DWI VANDIMAS</option>
<option data-n="2783">RAVE'AL DIMAS PRAYOGA</option>
<option data-n="2784">RISMACERLYN NUR ISKANDAR</option>
<option data-n="2785">SAMUEL DESWA ANGGARA</option>
<option data-n="2824">VAHDIL ASKA HARIANSYAH</option>
</select>
<label>NIPD sebagai password</label>
<input type="password" id="nipd" placeholder="Masukkan NIPD">
<button onclick="masuk()">Mulai Ulangan 🚀</button>
<p id="pesan"></p>
</section>

<section class="card hidden" id="kuis">
<h2 id="salam"></h2>
<p>Jawablah soal-soal berikut dengan teliti.</p>
<form id="formKuis">
<div id="daftarSoal"></div>
<button type="button" onclick="selesai()">Selesaikan Ulangan</button>
</form>
</section>

<section class="card hidden" id="hasil">
<h2>🏆 Hasil Ulangan</h2>
<div id="laporan"></div>
<button onclick="kirimEmail()">Siapkan Email Hasil</button>
</section>
</main>

<script>
const soal=[
{t:"pg",q:"Tujuan menganalisis foto lingkungan adalah ...",o:["Mencari masalah dan bukti visual","Menghafal warna","Membuat cerita khayalan","Menghitung benda"],k:0},
{t:"pg",q:"Peta pikiran berguna untuk ...",o:["Menghubungkan gagasan","Menghapus informasi","Menyalin tanpa memahami","Menghitung nilai"],k:0},
{t:"pg",q:"Biografi menceritakan ...",o:["Perjalanan hidup seseorang","Cara memasak","Aturan permainan","Cerita tanpa tokoh"],k:0},
{t:"pg",q:"Isabel dan Melati Wijsen dikenal memperjuangkan ...",o:["Pengurangan sampah plastik","Penebangan pohon","Penggunaan plastik","Permainan daring"],k:0},
{t:"pg",q:"Kegigihan berarti ...",o:["Terus berusaha","Mudah menyerah","Menghindar","Menyalahkan orang"],k:0},
{t:"pg",q:"Blog dapat berbentuk ...",o:["Tulisan atau catatan pribadi","Tabel perkalian saja","Daftar angka saja","Peta tanpa keterangan"],k:0},
{t:"pg",q:"Kronologis berarti berdasarkan ...",o:["Urutan waktu","Warna","Ukuran","Jumlah huruf"],k:0},
{t:"pg",q:"Malala memperjuangkan hak memperoleh ...",o:["Pendidikan","Hadiah","Makanan mewah","Permainan"],k:0},
{t:"pg",q:"Pidato persuasif bertujuan ...",o:["Mengajak pendengar","Membingungkan pendengar","Menyembunyikan pesan","Menghitung angka"],k:0},
{t:"pg",q:"Greta Thunberg menyuarakan isu ...",o:["Iklim dan lingkungan","Olahraga saja","Masakan","Transportasi pribadi"],k:0},
{t:"pg",q:"Bagian awal pidato disebut ...",o:["Pembuka","Isi","Penutup","Lampiran"],k:0},
{t:"pg",q:"Argumen merupakan ...",o:["Alasan pendukung pendapat","Salam penutup","Nama pembicara","Judul buku"],k:0},
{t:"pg",q:"Kalimat persuasif adalah ...",o:["Ayo kurangi sampah plastik!","Saya melihat sampah.","Ini sebuah botol.","Langit berwarna biru."],k:0},
{t:"pg",q:"Saat berpidato, suara sebaiknya ...",o:["Jelas dan terdengar","Sangat pelan","Tidak beraturan","Selalu berteriak"],k:0},
{t:"pg",q:"Peta pikiran dimulai dari ...",o:["Gagasan utama","Kesimpulan orang lain","Daftar nilai","Kalimat acak"],k:0},
{t:"multi",q:"Pilih tindakan mengurangi sampah plastik.",o:["Membawa tas guna ulang","Membawa botol isi ulang","Membuang sampah ke sungai","Memakai plastik sekali pakai terus-menerus"],k:[0,1]},
{t:"multi",q:"Biografi dapat berisi ...",o:["Pengalaman tokoh","Tantangan tokoh","Tindakan tokoh","Khayalan seluruhnya"],k:[0,1,2]},
{t:"multi",q:"Kronologi membantu pembaca ...",o:["Memahami urutan kejadian","Mengenali penanda waktu","Mengacak kejadian","Mengikuti cerita"],k:[0,1,3]},
{t:"multi",q:"Pidato persuasif yang baik memiliki ...",o:["Pesan jelas","Alasan pendukung","Hinaan","Bahasa santun"],k:[0,1,3]},
{t:"multi",q:"Sebelum berpidato, kita sebaiknya ...",o:["Membuat kerangka","Berlatih berbicara","Memeriksa argumen","Mengabaikan pendengar"],k:[0,1,2]},
{t:"match",q:"Biografi",o:["Teks perjalanan hidup seseorang","Urutan waktu","Bagan gagasan","Alasan pendapat","Pidato ajakan"],k:0},
{t:"match",q:"Kronologis",o:["Teks perjalanan hidup seseorang","Urutan waktu","Bagan gagasan","Alasan pendapat","Pidato ajakan"],k:1},
{t:"match",q:"Peta pikiran",o:["Teks perjalanan hidup seseorang","Urutan waktu","Bagan gagasan","Alasan pendapat","Pidato ajakan"],k:2},
{t:"match",q:"Argumen",o:["Teks perjalanan hidup seseorang","Urutan waktu","Bagan gagasan","Alasan pendapat","Pidato ajakan"],k:3},
{t:"match",q:"Pidato persuasif",o:["Teks perjalanan hidup seseorang","Urutan waktu","Bagan gagasan","Alasan pendapat","Pidato ajakan"],k:4},
{t:"isian",q:"Peta .... digunakan untuk menghubungkan gagasan.",k:"pikiran"},
{t:"isian",q:"Teks perjalanan hidup seseorang disebut ....",k:"biografi"},
{t:"isian",q:"Urutan peristiwa berdasarkan waktu disebut ....",k:"kronologis"},
{t:"isian",q:"Isabel dan Melati mengampanyekan pengurangan sampah ....",k:"plastik"},
{t:"isian",q:"Malala memperjuangkan hak memperoleh ....",k:"pendidikan"},
{t:"isian",q:"Pidato yang mengajak pendengar disebut pidato ....",k:"persuasif"},
{t:"isian",q:"Alasan pendukung pendapat disebut ....",k:"argumen"},
{t:"isian",q:"Bagian akhir pidato disebut bagian ....",k:"penutup"},
{t:"isian",q:"Sebelum menulis pidato, buatlah .... pidato.",k:"kerangka"},
{t:"isian",q:"Pidato sebaiknya disampaikan dengan suara yang ....",k:"jelas"},
{t:"uraian",q:"Jelaskan dua masalah lingkungan yang dapat ditemukan pada foto."},
{t:"uraian",q:"Bagaimana peta pikiran membantu mencari solusi sampah di sekolah?"},
{t:"uraian",q:"Nilai kegigihan apa yang dapat diteladani dari Isabel dan Melati?"},
{t:"uraian",q:"Mengapa peristiwa dalam biografi perlu diurutkan secara kronologis?"},
{t:"uraian",q:"Buat kerangka pidato ajakan untuk menjaga lingkungan."}
];
let namaSiswa="",hasilEmail="";
function masuk(){
const s=document.getElementById("nama");
const opt=s.options[s.selectedIndex];
if(!opt.value && opt.dataset.n===undefined){document.getElementById("pesan").textContent="Silakan pilih nama.";return}
if(document.getElementById("nipd").value!==opt.dataset.n){document.getElementById("pesan").textContent="NIPD tidak sesuai.";return}
namaSiswa=opt.text;
document.getElementById("login").classList.add("hidden");
document.getElementById("kuis").classList.remove("hidden");
document.getElementById("salam").textContent="Semangat, "+namaSiswa+"!";
gambarSoal();
}
function gambarSoal(){
document.getElementById("daftarSoal").innerHTML=soal.map((s,i)=>{
let isi="";
if(s.t==="pg"||s.t==="multi"){
isi=s.o.map((o,j)=>`<label><input style="width:auto" type="${s.t==="pg"?"radio":"checkbox"}" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("");
}else if(s.t==="match"){
isi=`<select name="q${i}"><option value="">Pilih pasangan</option>${s.o.map((o,j)=>`<option value="${j}">${o}</option>`).join("")}</select>`;
}else if(s.t==="isian"){
isi=`<input name="q${i}" type="text" placeholder="Jawaban singkat">`;
}else{
isi=`<textarea name="q${i}" rows="4" placeholder="Tuliskan jawabanmu"></textarea>`;
}
return `<div class="question"><b>${i+1}. ${s.q}</b>${isi}</div>`;
}).join("");
}
function selesai(){
let skor=0,uraian=[],rincian=[];
soal.forEach((s,i)=>{
if(s.t==="uraian"){
uraian.push(`${i+36}. ${s.q}\nJawaban: ${document.querySelector('[name="q'+i+'"]').value||"(kosong)"}`);
return;
}
let benar=false;
if(s.t==="pg"||s.t==="multi"){
let a=[...document.querySelectorAll('[name="q'+i+'"]:checked')].map(x=>+x.value);
let k=Array.isArray(s.k)?s.k:[s.k];
benar=a.length===k.length&&k.every(x=>a.includes(x));
}else if(s.t==="match"){
benar=+document.querySelector('[name="q'+i+'"]').value===s.k;
}else{
benar=document.querySelector('[name="q'+i+'"]').value.trim().toLowerCase()===s.k;
}
if(benar)skor++;
rincian.push(`${i+1}. ${benar?"Benar":"Belum tepat"}`);
});
let persen=Math.round(skor/35*100);
hasilEmail=`HASIL ULANGAN BAHASA INDONESIA KELAS VI\nBab 5: Anak-Anak yang Mengubah Dunia\nNama: ${namaSiswa}\nSkor otomatis: ${skor}/35 (${persen}%)\n\n${rincian.join("\n")}\n\nJAWABAN URAIAN:\n${uraian.join("\n\n")}`;
document.getElementById("kuis").classList.add("hidden");
document.getElementById("hasil").classList.remove("hidden");
document.getElementById("laporan").textContent=`Nama: ${namaSiswa}\nSkor otomatis: ${skor}/35 (${persen}%)\nSoal uraian menunggu penilaian guru.`;
}
function kirimEmail(){
location.href="mailto:danysetyanto.ds@gmail.com?subject="+encodeURIComponent("Hasil Ulangan Kelas VI - "+namaSiswa)+"&body="+encodeURIComponent(hasilEmail);
}
</script>
</body>
</html>
